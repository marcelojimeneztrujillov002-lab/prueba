<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnicoLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .loading {
            color: #6b7280;
            font-size: 15px;
        }

        .error {
            color: #dc2626;
            font-size: 15px;
        }

        #game-frame {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="output" class="loading">Cargando...</div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search.replace(/&amp;/g, '&'));
            var hash = params.get('hash');
            var a = params.get('a');
            var b = params.get('b');
            var output = document.getElementById('output');

            if (!hash || a === null || b === null) {
                output.className = 'error';
                output.textContent = 'Faltan parámetros. Se requiere: hash, a y b.';
                return;
            }

            fetch('https://n8n.dataroomperu.com/webhook/ada7bfa0-0cd9-4fbc-98bf-b3af19bde2a5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hash: hash, a: Number(a), b: Number(b) })
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success === 1 && data.hash) {
                    output.innerHTML = '';
                    var iframe = document.createElement('iframe');
                    iframe.id = 'game-frame';
                    iframe.src = data.hash;
                    output.parentElement.appendChild(iframe);
                } else {
                    output.className = 'error';
                    output.textContent = data.mensaje || 'No se pudo procesar la solicitud.';
                }
            })
            .catch(function () {
                output.className = 'error';
                output.textContent = 'Error al conectar con el servidor.';
            });
        })();
    </script>
</body>
</html>
