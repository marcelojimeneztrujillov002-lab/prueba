<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnicoLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; overflow: auto; background: #fff; }

        .riddle2-wrapper {
            margin: 0 auto !important;
            max-width: 100% !important;
            width: 100% !important;
        }

        .riddle2-wrapper iframe {
            width: 100% !important;
            min-height: 100vh !important;
            border: none;
        }

        .screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; font-family: system-ui, -apple-system, sans-serif;
            padding: 24px; text-align: center;
        }

        .loader {
            width: 40px; height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text { margin-top: 16px; color: #6b7280; font-size: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-icon { font-size: 48px; margin-bottom: 16px; }
        .error-title { font-size: 18px; font-weight: 600; color: #1f2937; margin-bottom: 8px; }
        .error-msg { font-size: 14px; color: #6b7280; max-width: 320px; line-height: 1.5; }

        .debug-url {
            background: #1f2937; color: #34d399;
            font-family: 'Courier New', monospace; font-size: 11px;
            padding: 8px 12px; word-break: break-all;
            position: fixed; bottom: 0; left: 0; right: 0;
            z-index: 9999; opacity: 0.85;
        }
    </style>
</head>
<body>
    <div id="output" class="screen">
        <div class="loader"></div>
        <p class="loader-text">Preparando tu juego...</p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var hash = params.get('hash');
            var user = params.get('user');
            var cmp = params.get('cmp');
            var output = document.getElementById('output');

            function showError(title, msg) {
                output.className = 'screen';
                output.innerHTML = '<div class="error-icon">&#9888;</div>' +
                    '<div class="error-title">' + title + '</div>' +
                    '<div class="error-msg">' + msg + '</div>';
            }

            if (!hash || !user || !cmp) {
                showError('Parámetros faltantes', 'Se requiere: hash, user y cmp.');
                return;
            }

            fetch('https://n8n.dataroomperu.com/webhook/ada7bfa0-0cd9-4fbc-98bf-b3af19bde2a5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hash: hash, user: user, cmp: Number(cmp) })
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success === 1 && data.hash) {
                    var iframeSrc = 'https://www.riddle.com/embed/a/FG7R84PN?lazyImages=false&staticHeight=false&source=' + encodeURIComponent(data.hash);

                    document.body.innerHTML = '';

                    var debug = document.createElement('div');
                    debug.className = 'debug-url';
                    debug.textContent = iframeSrc;
                    document.body.appendChild(debug);

                    var wrapper = document.createElement('div');
                    wrapper.className = 'riddle2-wrapper';
                    wrapper.setAttribute('data-is-qzzr', 'false');
                    wrapper.setAttribute('data-rid-id', 'FG7R84PN');
                    wrapper.setAttribute('data-auto-scroll', 'true');
                    wrapper.setAttribute('data-is-fixed-height-enabled', 'false');
                    wrapper.setAttribute('data-bg', '#fff');
                    wrapper.setAttribute('data-fg', '#00205b');
                    wrapper.style.cssText = 'margin:0 auto; max-width:100%; width:640px;';

                    var script = document.createElement('script');
                    script.src = 'https://www.riddle.com/embed/build-embedjs/embedV2.js';

                    var iframe = document.createElement('iframe');
                    iframe.title = 'Quiz_Variado_3';
                    iframe.src = iframeSrc;
                    iframe.allow = 'autoplay';
                    iframe.referrerPolicy = 'strict-origin';

                    wrapper.appendChild(script);
                    wrapper.appendChild(iframe);
                    document.body.appendChild(wrapper);
                } else {
                    showError('Algo salió mal', data.mensaje || 'No se pudo procesar la solicitud.');
                }
            })
            .catch(function () {
                showError('Sin conexión', 'No se pudo conectar con el servidor. Intenta de nuevo.');
            });
        })();
    </script>
</body>
</html>
