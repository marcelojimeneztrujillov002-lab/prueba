<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnicoLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .loading {
            color: #6b7280;
            font-size: 15px;
        }

        .error {
            color: #dc2626;
            font-size: 15px;
        }

        #game-frame {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 12px;
        }

        .src-debug {
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #6b7280;
            word-break: break-all;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="output" class="loading">Cargando...</div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var hash = params.get('hash');
            var user = params.get('user');
            var cmp = params.get('cmp');
            var output = document.getElementById('output');

            if (!hash || !user || !cmp) {
                output.className = 'error';
                output.textContent = 'Faltan parámetros. Se requiere: hash, user y cmp.';
                return;
            }

            fetch('https://n8n.dataroomperu.com/webhook/ada7bfa0-0cd9-4fbc-98bf-b3af19bde2a5', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hash: hash, user: user, cmp: Number(cmp) })
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success === 1 && data.hash) {
                    var iframeSrc = 'https://www.riddle.com/embed/a/FG7R84PN?lazyImages=false&staticHeight=false&source=' + encodeURIComponent(data.hash);
                    output.innerHTML = '';
                    var srcDebug = document.createElement('div');
                    srcDebug.className = 'src-debug';
                    srcDebug.textContent = iframeSrc;
                    output.parentElement.appendChild(srcDebug);
                    var iframe = document.createElement('iframe');
                    iframe.id = 'game-frame';
                    iframe.title = 'Quiz_Variado_3';
                    iframe.src = iframeSrc;
                    iframe.allow = 'autoplay';
                    iframe.referrerPolicy = 'strict-origin';
                    output.parentElement.appendChild(iframe);
                } else {
                    output.className = 'error';
                    output.textContent = data.mensaje || 'No se pudo procesar la solicitud.';
                }
            })
            .catch(function () {
                output.className = 'error';
                output.textContent = 'Error al conectar con el servidor.';
            });
        })();
    </script>
</body>
</html>
